<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoreFit · Centri ADS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blu:#049ddf;--blu-s:#0379ac;--ink:#15232e;--ink-soft:#5a6b78;
  --bg:#eef2f6;--card:#fff;--line:#dde4eb;
  --verde:#1eaa5c;--verde-bg:#e3f6ec;
  --arancio:#e8860c;--arancio-bg:#fdf1de;
  --rosso:#d93a3a;--rosso-bg:#fdebeb;
  --shadow:0 1px 3px rgba(21,35,46,.08), 0 1px 2px rgba(21,35,46,.04);
  --shadow-hover:0 4px 12px rgba(21,35,46,.12), 0 2px 4px rgba(21,35,46,.06);
}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;min-height:100vh}

/* HEADER */
.hdr{background:linear-gradient(135deg,#03364c 0%,#055a80 55%,#049ddf 130%);padding:16px}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.logo-img{height:38px;width:auto;display:block;filter:drop-shadow(0 1px 4px rgba(0,0,0,.3))}
.sotto-logo{color:rgba(255,255,255,.8);font-size:12px;font-weight:500;letter-spacing:.3px}
.save-dot{font-size:10px;margin-left:4px}
.btn-admin{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12px;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;transition:background .15s}
.btn-admin:hover{background:rgba(255,255,255,.25)}
.btn-admin.active{background:#fff;color:var(--blu-s)}

/* TOOLBAR */
.toolbar-wrap{background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.toolbar{padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;max-width:1200px;margin:0 auto;width:100%}
.toolbar input[type=search]{flex:1;min-width:180px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--bg);color:var(--ink);outline:none;transition:border-color .15s}
.toolbar input[type=search]:focus{border-color:var(--blu);background:#fff}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:none;padding:7px 12px;cursor:pointer;font-size:12px;color:var(--ink-soft);font-weight:500;transition:background .12s,color .12s}
.seg button.on{background:var(--blu);color:#fff;font-weight:600}
.seg button:hover:not(.on){background:rgba(4,157,223,.08);color:var(--blu)}
.btn{border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:background .15s,transform .1s}
.btn-primary{background:var(--blu);color:#fff}
.btn-primary:hover{background:var(--blu-s)}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink-soft)}
.btn-ghost:hover{border-color:var(--blu);color:var(--blu)}

/* MAIN */
main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}

/* INTESTAZIONE COLONNE */
.hdrs{
  display:grid;gap:10px;padding:8px 16px;
  grid-template-columns:minmax(140px,1.4fr) 80px 110px 44px 70px 80px 70px 120px 90px;
  font-size:10px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--ink-soft);font-weight:700;
  border-radius:10px 10px 0 0;background:var(--bg);
  border:1px solid var(--line);border-bottom:none;
}
.h-azioni{text-align:right}
.h-otp{text-align:center}

/* LISTA */
.lista{display:flex;flex-direction:column;gap:6px;margin-top:0}

/* RIGA */
.riga{
  background:var(--card);
  border-radius:10px;
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  overflow:hidden;
  transition:box-shadow .15s, border-color .15s;
}
.riga:hover{box-shadow:var(--shadow-hover);border-color:#c5d0da}
.riga.ritardo{border-left:4px solid var(--rosso)}
.riga.attenzione{border-left:4px solid var(--arancio)}
.riga.fresco{border-left:4px solid var(--verde)}

.rm{
  display:grid;gap:10px;padding:12px 16px;cursor:pointer;align-items:center;
  grid-template-columns:minmax(140px,1.4fr) 80px 110px 44px 70px 80px 70px 120px 90px;
}
.rm:hover{background:linear-gradient(90deg,#fafdff 0%,#fff 100%)}

.nome{font-weight:600;font-size:14px;color:var(--ink);line-height:1.3}
.nome small{display:block;font-weight:400;font-size:11px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}

/* BADGE */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;letter-spacing:.2px}
.b-att{background:#dcfce7;color:#166534}
.b-sos{background:#fee2e2;color:#991b1b}
.b-pro{background:#fef3c7;color:#92400e}
.b-sf{background:#dbeafe;color:#1e40af}
.b-af{background:#fef9c3;color:#854d0e}
.b-meta{background:#ede9fe;color:#5b21b6}
.b-google{background:#fee2e2;color:#991b1b}
.b-ems{background:#f1f5f9;color:#475569}
.b-infrabike{background:#dcfce7;color:#166534}
.b-vacu{background:#f5f3ff;color:#5b21b6}
.gruppo-header{
  padding:10px 16px 6px;font-size:10px;text-transform:uppercase;
  letter-spacing:.8px;font-weight:700;color:var(--ink-soft);
  display:flex;align-items:center;gap:8px;margin-top:16px;
}
.gruppo-header:first-child{margin-top:0}
.gruppo-header::after{content:'';flex:1;height:1px;background:var(--line)}
.budget-badge{
  display:inline-flex;align-items:center;gap:3px;
  background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;
  border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700;
}
.budget-zero{background:#f8fafc;color:#94a3b8;border-color:#e2e8f0}
.nota-preview{
  display:inline-block;background:#fefce8;color:#854d0e;
  border:1px solid #fef08a;border-radius:5px;padding:1px 6px;
  font-size:10px;margin-top:3px;max-width:260px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.nota-area{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;
  font-size:12px;font-family:inherit;resize:vertical;min-height:55px;
  background:var(--card);color:var(--ink);transition:border-color .12s;
}
.nota-area:focus{border-color:var(--blu);outline:none}
.budget-input{
  width:110px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;
  font-size:13px;background:var(--card);color:var(--ink);
}

.otp{font-size:11px;color:var(--ink-soft);text-align:center;font-weight:500}
.otp.no{color:var(--rosso);font-weight:700}
.dc b{display:block;font-size:12.5px;color:var(--ink);font-weight:600}
.gg{font-size:11px;margin-top:1px}
.gg.ok{color:var(--verde)}.gg.warn{color:var(--arancio)}.gg.late{color:var(--rosso);font-weight:700}
.ar{display:flex;gap:5px;justify-content:flex-end}
.mini{
  border:1px solid var(--line);background:var(--card);border-radius:7px;
  padding:5px 10px;font-size:11px;cursor:pointer;color:var(--ink-soft);
  font-weight:600;white-space:nowrap;transition:all .12s;
}
.mini:hover{border-color:var(--blu);color:var(--blu);background:#f0f8fe}

/* DETTAGLIO */
.det{display:none;border-top:1px solid var(--line);padding:14px 16px;background:#f8fbfe}
.riga.aperta .det{display:block}
.det-grid{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.campo{display:flex;flex-direction:column;gap:4px}
.campo label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);font-weight:700}
.campo select,.campo input[type=text]{
  padding:7px 10px;border:1px solid var(--line);border-radius:7px;
  font-size:12px;background:var(--card);color:var(--ink);
  transition:border-color .12s;
}
.campo select:focus,.campo input[type=text]:focus{border-color:var(--blu);outline:none}
.log-title{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);font-weight:700;margin-bottom:8px}
.log{display:flex;flex-direction:column;max-height:220px;overflow-y:auto;border-radius:7px;border:1px solid var(--line);background:var(--card);padding:0 10px}
.log-item{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12px;align-items:center}
.log-item:last-child{border-bottom:none}
.log-data{color:var(--ink-soft);font-size:11px;min-width:80px;font-variant-numeric:tabular-nums}
.log-txt{flex:1;color:var(--ink)}
.log-btn{border:none;background:none;cursor:pointer;padding:3px 5px;border-radius:5px;font-size:13px;line-height:1;flex-shrink:0;transition:color .12s,background .12s}
.log-edit{color:#c5d0da}.log-edit:hover{color:var(--blu);background:#dbeafe}
.log-del{color:#c5d0da}.log-del:hover{color:var(--rosso);background:var(--rosso-bg)}
.log-vuoto{color:var(--ink-soft);font-size:12px;font-style:italic;padding:8px 0}
.det-foot{display:flex;justify-content:flex-end;margin-top:12px}
.el-btn{background:none;border:none;color:var(--rosso);font-size:11px;cursor:pointer;text-decoration:underline;opacity:.7}
.el-btn:hover{opacity:1}
.readonly-note{color:var(--ink-soft);font-size:12px;font-style:italic;padding:6px 0 10px}

/* EMPTY */
.vuoto{text-align:center;color:var(--ink-soft);padding:60px 0;font-size:13px}
.loading{text-align:center;color:var(--ink-soft);padding:60px 0;font-size:13px}

/* DIALOGS */
dialog{
  border:none;border-radius:14px;padding:0;max-width:440px;width:92%;
  box-shadow:0 20px 60px rgba(3,54,76,.2);background:var(--card);color:var(--ink);
}
dialog::backdrop{background:rgba(8,30,42,.45)}
.dlg{padding:22px}
.dlg h3{font-size:16px;margin-bottom:14px;color:var(--ink);font-weight:600}
.dlg .campo{margin-bottom:11px}
.dlg textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  font-size:13px;font-family:inherit;resize:vertical;min-height:70px;
  background:var(--card);color:var(--ink);transition:border-color .12s;
}
.dlg textarea:focus{border-color:var(--blu);outline:none}
.dlg input[type=password]{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  font-size:13px;background:var(--card);color:var(--ink);transition:border-color .12s;
}
.dlg input[type=password]:focus{border-color:var(--blu);outline:none}
.dlg-act{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.err-msg{color:var(--rosso);font-size:12px;margin-top:6px;display:none}

/* TOAST */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);
  background:#15232e;color:#fff;padding:10px 18px;border-radius:10px;
  font-size:12px;opacity:0;transition:all .22s;z-index:999;pointer-events:none;
  white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.3);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* MOBILE */
@media(max-width:800px){
  .hdrs{display:none}
  .rm{grid-template-columns:1fr auto;grid-template-areas:"nome ar" "meta meta"}
  .rm>.nome{grid-area:nome}
  .rm>.ar{grid-area:ar}
  .col-stato,.col-pag,.col-otp,.col-piatt,.col-tipo,.col-budget,.col-data{display:none}
  .col-meta{grid-area:meta;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:4px}
}
@media(min-width:801px){.col-meta{display:none}}
</style>
</head>

<script>
const SUPABASE_URL = 'https://khpxtshpiqiokmwkilzg.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtocHh0c2hwaXFpb2ttd2tpbHpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNjI0MDgsImV4cCI6MjA5NjgzODQwOH0.0_uxWSLmgxT5PQp4aNV3JNY4Q0sNatfipHfn2t7wD04';
const ADMIN_PWD = 'Salvomattina80@';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let centri = [];
let isAdmin = false;
let filtro = 'tutti';
let ricerca = '';
let azioneTarget = null;
let azioneEditIdx = null;

// ---- Utility ----
function oggi() { return new Date().toISOString().slice(0,10); }
function fmtData(iso) {
  if(!iso) return '–';
  const [a,m,g] = iso.slice(0,10).split('-');
  return `${g}/${m}/${a}`;
}
function giorniFa(iso) {
  if(!iso) return 999;
  const d = new Date(iso+'T12:00:00');
  return Math.floor((Date.now()-d.getTime())/86400000);
}
function esc(s) { const d=document.createElement('div');d.textContent=s;return d.innerHTML; }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}
function statoSalvataggio(ok) {
  const el = document.getElementById('save-dot');
  if(!el) return;
  el.textContent = ok ? '● salvato' : '○ in sospeso';
  el.style.color = ok ? 'rgba(255,255,255,.65)' : '#ffd28a';
}

// ---- Supabase ----
async function carica() {
  const { data, error } = await sb.from('centri').select('*').order('ultimo_check', { ascending: true, nullsFirst: true });
  if(error) { console.error(error); toast('⚠ Errore caricamento'); return; }
  centri = data || [];
  render();
}

async function salvacentro(c) {
  statoSalvataggio(false);
  const payload = {
    nome: c.nome, stato: c.stato, pagamento: c.pagamento,
    otp: c.otp, ultimo_check: c.ultimo_check, log: c.log,
    piattaforma: c.piattaforma || 'meta', tipo: c.tipo || 'ems',
    note: c.note || '', budget: c.budget || 0
  };
  const { error } = await sb.from('centri').update(payload).eq('id', c.id);
  if(error) { toast('⚠ Errore salvataggio'); console.error(error); return; }
  statoSalvataggio(true);
}

async function inserisciCentro(c) {
  const { data, error } = await sb.from('centri').insert([c]).select().single();
  if(error) { toast('⚠ Errore inserimento'); console.error(error); return null; }
  return data;
}

async function eliminaCentroDb(id) {
  const { error } = await sb.from('centri').delete().eq('id', id);
  if(error) { toast('⚠ Errore eliminazione'); console.error(error); return false; }
  return true;
}

// ---- Render ----
function render() {
  const cont = document.getElementById('contenuto');
  let vis = centri.filter(c => c.nome.toLowerCase().includes(ricerca));
  if(filtro === 'ritardo') vis = vis.filter(c => giorniFa(c.ultimo_check) > 7);
  if(filtro === 'meta') vis = vis.filter(c => (c.piattaforma||'meta') === 'meta');
  if(filtro === 'google') vis = vis.filter(c => c.piattaforma === 'google');
  vis.sort((a,b) => {
    const tipoOrd = {ems:0, infrabike:1, vacutherm:2};
    const ta = tipoOrd[a.tipo||'ems'] ?? 3;
    const tb = tipoOrd[b.tipo||'ems'] ?? 3;
    if(ta !== tb) return ta - tb;
    return a.nome.localeCompare(b.nome, 'it');
  });


  document.getElementById('btn-nuovo').style.display = isAdmin ? 'inline-flex' : 'none';

  const btnAdmin = document.getElementById('btn-admin-toggle');
  btnAdmin.textContent = isAdmin ? '✓ Admin' : '🔒 Admin';
  btnAdmin.classList.toggle('active', isAdmin);

  if(!vis.length) {
    cont.innerHTML = '<div class="vuoto">Nessun centro trovato.</div>';
    return;
  }

  const aperti = new Set([...document.querySelectorAll('.riga.aperta')].map(r => r.dataset.id));

  // Raggruppa per tipo
  const gruppiLabel = {ems:'EMS', infrabike:'Infrabike', vacutherm:'Vacutherm'};
  let listaHtml = '';
  let tipoCorrente = null;
  for(const c of vis) {
    const tipo = c.tipo || 'ems';
    // Solo per filtri non-piattaforma mostra gruppi
    if(filtro !== 'meta' && filtro !== 'google' && filtro !== 'ritardo') {
      if(tipo !== tipoCorrente) {
        tipoCorrente = tipo;
        const label = gruppiLabel[tipo] || tipo.toUpperCase();
        listaHtml += `<div class="gruppo-header">${label}</div>`;
      }
    }
    listaHtml += rigaHtml(c, aperti.has(c.id));
  }

  cont.innerHTML = `
    <div class="hdrs">
      <span>Centro</span><span>Stato</span><span>Pagamento</span>
      <span class="h-otp">OTP</span><span>Piatt.</span><span>Tipo</span><span>Budget</span><span>Ultimo controllo</span>
      <span class="h-azioni">Azioni</span>
    </div>
    <div class="lista">${listaHtml}</div>
  `;
}

function rigaHtml(c, aperta) {
  const gg = giorniFa(c.ultimo_check);
  const classe = gg > 7 ? 'ritardo' : gg > 3 ? 'attenzione' : 'fresco';
  const ggClasse = gg > 7 ? 'late' : gg > 3 ? 'warn' : 'ok';
  const ggTxt = gg === 0 ? 'oggi' : gg === 1 ? 'ieri' : gg === 999 ? 'mai' : gg+' giorni fa';
  const ultimaAzione = c.log && c.log.length ? c.log[c.log.length-1].testo : '';
  const nota = c.note || '';
  const budget = c.budget || 0;
  const notaPreview = nota ? `<span class="nota-preview" title="${esc(nota)}">📝 ${esc(nota)}</span>` : '';
  const budgetBadge = budget > 0
    ? `<span class="budget-badge">€${budget}/d</span>`
    : '<span class="budget-badge budget-zero">–</span>';
  const piattaforma = c.piattaforma || 'meta';
  const tipo = c.tipo || 'ems';
  const piattBadge = piattaforma==='google'
    ? '<span class="badge b-google">Google</span>'
    : '<span class="badge b-meta">Meta</span>';
  const tipoBadge = tipo==='infrabike'
    ? '<span class="badge b-infrabike">Infrabike</span>'
    : tipo==='vacutherm'
    ? '<span class="badge b-vacu">Vacutherm</span>'
    : '<span class="badge b-ems">EMS</span>';
  const statoBadge = c.stato==='attivo'?'<span class="badge b-att">Attivo</span>':
    c.stato==='sospeso'?'<span class="badge b-sos">Sospeso</span>':'<span class="badge b-pro">Problema</span>';
  const pagBadge = c.pagamento==='storefit'?'<span class="badge b-sf">Carta StoreFit</span>':'<span class="badge b-af">Carta Affiliato</span>';
  const log = c.log || [];
  const logHtml = log.length ?
    [...log].map((l,i)=>({...l,i})).reverse().map(l=>`
      <div class="log-item">
        <span class="log-data">${fmtData(l.data)}</span>
        <span class="log-txt">${esc(l.testo)}</span>
        ${isAdmin?`<button class="log-btn log-edit" onclick="event.stopPropagation();editAzione('${c.id}',${l.i})" title="Modifica">✎</button>
        <button class="log-btn log-del" onclick="event.stopPropagation();eliminaAzione('${c.id}',${l.i})" title="Elimina">✕</button>`:''}
      </div>`).join('') :
    '<div class="log-vuoto">Nessuna azione registrata.</div>';

  const azioneBtn = isAdmin ? `<button class="mini" onclick="event.stopPropagation();apriAzione('${c.id}')">+ Azione</button>` : '';
  const detFooter = isAdmin ? `<div class="det-foot"><button class="el-btn" onclick="eliminaCentro('${c.id}')">Elimina centro</button></div>` : '';
  const detCampi = isAdmin ? `
    <div class="det-grid">
      <div class="campo"><label>Stato</label>
        <select onchange="modificaCentro('${c.id}','stato',this.value)">
          <option value="attivo" ${c.stato==='attivo'?'selected':''}>Attivo</option>
          <option value="problema" ${c.stato==='problema'?'selected':''}>Problema</option>
          <option value="sospeso" ${c.stato==='sospeso'?'selected':''}>Sospeso</option>
        </select></div>
      <div class="campo"><label>Pagamento</label>
        <select onchange="modificaCentro('${c.id}','pagamento',this.value)">
          <option value="affiliato" ${c.pagamento==='affiliato'?'selected':''}>Carta Affiliato</option>
          <option value="storefit" ${c.pagamento==='storefit'?'selected':''}>Carta StoreFit</option>
        </select></div>
      <div class="campo"><label>OTP</label>
        <select onchange="modificaCentro('${c.id}','otp',this.value)">
          <option value="si" ${c.otp==='si'?'selected':''}>Sì</option>
          <option value="no" ${c.otp==='no'?'selected':''}>No</option>
        </select></div>
      <div class="campo"><label>Piattaforma</label>
        <select onchange="modificaCentro('${c.id}','piattaforma',this.value)">
          <option value="meta" ${(c.piattaforma||'meta')==='meta'?'selected':''}>Meta Ads</option>
          <option value="google" ${(c.piattaforma||'meta')==='google'?'selected':''}>Google Ads</option>
        </select></div>
      <div class="campo"><label>Tipo</label>
        <select onchange="modificaCentro('${c.id}','tipo',this.value)">
          <option value="ems" ${(c.tipo||'ems')==='ems'?'selected':''}>EMS</option>
          <option value="infrabike" ${(c.tipo||'ems')==='infrabike'?'selected':''}>Infrabike</option>
          <option value="vacutherm" ${(c.tipo||'ems')==='vacutherm'?'selected':''}>Vacutherm</option>
        </select></div>
      <div class="campo"><label>Budget €/giorno</label>
        <input type="text" class="budget-input" value="${c.budget||0}"
          onchange="modificaCentro('${c.id}','budget',parseFloat(this.value)||0)"></div>
    </div>
    <div class="campo" style="margin-bottom:12px">
      <label>Note interne</label>
      <textarea class="nota-area" onchange="modificaCentro('${c.id}','note',this.value)">${esc(nota)}</textarea>
    </div>` : `<p class="readonly-note">Accedi come admin per modificare.</p>`;

  return `<div class="riga ${classe} ${aperta?'aperta':''}" data-id="${c.id}">
    <div class="rm" onclick="toggleDet(event,'${c.id}')">
      <div class="nome">${esc(c.nome)}${ultimaAzione&&ultimaAzione!=='Controllo'?`<small>↳ ${esc(ultimaAzione)}</small>`:''} ${notaPreview}</div>
      <div class="col-stato">${statoBadge}</div>
      <div class="col-pag">${pagBadge}</div>
      <div class="col-otp otp ${c.otp==='no'?'no':''}">${c.otp==='no'?'OTP ✗':'OTP ✓'}</div>
      <div class="col-piatt">${piattBadge}</div>
      <div class="col-tipo">${tipoBadge}</div>
      <div class="col-budget">${budgetBadge}</div>
      <div class="col-data dc"><b>${fmtData(c.ultimo_check)}</b><span class="gg ${ggClasse}">${ggTxt}</span></div>
      <div class="col-meta">${statoBadge}${pagBadge}${piattBadge}${tipoBadge}<span class="gg ${ggClasse}">${ggTxt}</span></div>
      <div class="ar">${azioneBtn}</div>
    </div>
    <div class="det">
      ${detCampi}
      <div class="log-title">Storico azioni</div>
      <div class="log">${logHtml}</div>
      ${detFooter}
    </div>
  </div>`;
}

// ---- Azioni ----
function trova(id) { return centri.find(c => c.id === id); }

window.toggleDet = (ev, id) => {
  if(ev.target.closest('button,select,input')) return;
  document.querySelector(`.riga[data-id="${id}"]`).classList.toggle('aperta');
};

window.modificaCentro = async (id, campo, val) => {
  if(!isAdmin) return;
  const c = trova(id); c[campo] = val;
  await salvacentro(c); render(); toast('✓ Salvato');
};

window.apriAzione = (id) => {
  if(!isAdmin) return;
  azioneTarget = id; azioneEditIdx = null;
  document.getElementById('dlg-azione-titolo').textContent = 'Registra azione · ' + trova(id).nome;
  document.getElementById('azione-testo').value = '';
  document.getElementById('azione-salva').textContent = 'Salva';
  document.getElementById('dlg-azione').showModal();
  document.getElementById('azione-testo').focus();
};

window.editAzione = (id, idx) => {
  if(!isAdmin) return;
  azioneTarget = id; azioneEditIdx = idx;
  const c = trova(id);
  document.getElementById('dlg-azione-titolo').textContent = 'Modifica azione · ' + c.nome;
  document.getElementById('azione-testo').value = c.log[idx].testo;
  document.getElementById('azione-salva').textContent = 'Aggiorna';
  document.getElementById('dlg-azione').showModal();
  document.getElementById('azione-testo').focus();
};

window.eliminaAzione = async (id, idx) => {
  if(!isAdmin) return;
  const c = trova(id);
  c.log.splice(idx, 1);
  if(c.log.length) c.ultimo_check = c.log[c.log.length-1].data;
  else c.ultimo_check = null;
  await salvacentro(c); render();
};

window.eliminaCentro = async (id) => {
  if(!isAdmin) return;
  const c = trova(id);
  if(!confirm(`Eliminare "${c.nome}" e tutto il suo storico?`)) return;
  const ok = await eliminaCentroDb(id);
  if(ok) { centri = centri.filter(x => x.id !== id); render(); toast('Centro eliminato'); }
};

// Dialog azione
document.getElementById('azione-salva').onclick = async () => {
  const txt = document.getElementById('azione-testo').value.trim();
  if(!txt) return;
  const c = trova(azioneTarget);
  if(azioneEditIdx !== null) {
    c.log[azioneEditIdx].testo = txt;
    document.getElementById('dlg-azione').close();
    await salvacentro(c); render(); toast('✓ Azione aggiornata');
  } else {
    c.log = c.log || [];
    c.log.push({ data: oggi(), testo: txt });
    c.ultimo_check = oggi();
    document.getElementById('dlg-azione').close();
    await salvacentro(c); render(); toast(`✓ Azione salvata`);
  }
};
document.getElementById('azione-annulla').onclick = () => document.getElementById('dlg-azione').close();

// Dialog nuovo centro
document.getElementById('btn-nuovo').onclick = () => {
  document.getElementById('nuovo-nome').value = '';
  document.getElementById('dlg-nuovo').showModal();
  document.getElementById('nuovo-nome').focus();
};
document.getElementById('nuovo-salva').onclick = async () => {
  const nome = document.getElementById('nuovo-nome').value.trim();
  if(!nome) return;
  const nuovo = {
    nome, stato: 'attivo',
    pagamento: document.getElementById('nuovo-pag').value,
    otp: document.getElementById('nuovo-otp').value,
    piattaforma: document.getElementById('nuovo-piatt').value,
    tipo: document.getElementById('nuovo-tipo').value,
    budget: parseFloat(document.getElementById('nuovo-budget').value) || 0,
    note: '', ultimo_check: null, log: []
  };
  document.getElementById('dlg-nuovo').close();
  const inserito = await inserisciCentro(nuovo);
  if(inserito) { centri.push(inserito); render(); toast(`✓ "${nome}" aggiunto`); }
};
document.getElementById('nuovo-annulla').onclick = () => document.getElementById('dlg-nuovo').close();

// Login admin
document.getElementById('btn-admin-toggle').onclick = () => {
  if(isAdmin) { isAdmin = false; render(); toast('Modalità lettura'); return; }
  document.getElementById('login-pwd').value = '';
  document.getElementById('login-err').style.display = 'none';
  document.getElementById('dlg-login').showModal();
  document.getElementById('login-pwd').focus();
};
document.getElementById('login-entra').onclick = () => {
  const pwd = document.getElementById('login-pwd').value;
  if(pwd === ADMIN_PWD) {
    isAdmin = true;
    document.getElementById('dlg-login').close();
    render(); toast('✓ Modalità admin attiva');
  } else {
    document.getElementById('login-err').style.display = 'block';
  }
};
document.getElementById('login-annulla').onclick = () => document.getElementById('dlg-login').close();
document.getElementById('login-pwd').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('login-entra').click(); });

// Ricerca e filtri
document.getElementById('cerca').oninput = e => { ricerca = e.target.value.toLowerCase(); render(); };
document.getElementById('filtri').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  filtro = b.dataset.f;
  document.querySelectorAll('#filtri button').forEach(x => x.classList.toggle('on', x===b));
  render();
};

// Avvio
carica();
</script>
</body>
</html>
